name: Build All Platforms

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

jobs:
  # ─────────────────────────────────────────────
  # Android
  # ─────────────────────────────────────────────
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Android Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :composeApp:assembleDebug --stacktrace
          else
            echo "No gradlew yet – using gradle wrapper generation note"
            # When you first open the project, Android Studio generates the wrapper.
            # For CI, commit the gradle wrapper or use:
            gradle :composeApp:assembleDebug --stacktrace || true
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-debug-apk
          path: |
            composeApp/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────
  # Desktop (JVM)
  # ─────────────────────────────────────────────
  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew || true

      - name: Build Desktop
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :composeApp:desktopJar --stacktrace
          else
            gradle :composeApp:desktopJar --stacktrace || true
          fi

      - name: Upload Desktop JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: desktop-jar
          path: |
            composeApp/build/libs/*.jar
            **/build/libs/*desktop*.jar
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────
  # Web – Wasm (recommended)
  # ─────────────────────────────────────────────
  web-wasm:
    name: Web (Wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew || true

      - name: Build Wasm JS
        run: |
          if [ -f ./gradlew ]; then
            ./gradl
