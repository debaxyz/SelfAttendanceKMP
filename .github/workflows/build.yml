name: Build All Platforms

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: \( {{ github.workflow }}- \){{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

jobs:
  # ── Android ──────────────────────────────────
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew || true
      - name: Build Android Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :composeApp:assembleDebug --stacktrace
          else
            gradle :composeApp:assembleDebug --stacktrace || true
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-debug-apk
          path: |
            composeApp/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

  # ── Desktop ──────────────────────────────────
  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew || true
      - name: Build Desktop
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :composeApp:desktopJar --stacktrace
          else
            gradle :composeApp:desktopJar --stacktrace || true
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: desktop-jar
          path: |
            composeApp/build/libs/*.jar
            **/build/libs/*desktop*.jar
          if-no-files-found: ignore
          retention-days: 7

  # ── Web (Wasm) ───────────────────────────────
  web-wasm:
    name: Web (Wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew || true
      - name: Build Wasm JS
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace
          else
            gradle :composeApp:wasmJsBrowserDistribution --stacktrace || true
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: web-wasm-dist
          path: |
            composeApp/build/dist/wasmJs/productionExecutable
            composeApp/build/dist/wasmJs/**
          if-no-files-found: ignore
          retention-days: 7

  # ── Web (JS) ─────────────────────────────────
  web-js:
    name: Web (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew || true
      - name: Build JS
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :composeApp:jsBrowserDistribution --stacktrace
          else
            gradle :composeApp:jsBrowserDistribution --stacktrace || true
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: web-js-dist
          path: |
            composeApp/build/dist/js/productionExecutable
            composeApp/build/dist/js/**
          if-no-files-found: ignore
          retention-days: 7

  # ── iOS (macOS required) ─────────────────────
  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew || true
      - name: Build iOS Framework (Simulator)
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
          else
            gradle :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace || true
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-framework
          path: |
            composeApp/build/bin/iosSimulatorArm64/debugFramework
            composeApp/build/xcode-frameworks/**
          if-no-files-found: ignore
          retention-days: 7

  # ── Summary ──────────────────────────────────
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [android, desktop, web-wasm, web-js, ios]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Android  : ${{ needs.android.result }}"
          echo "Desktop  : ${{ needs.desktop.result }}"
          echo "Web Wasm : ${{ needs.web-wasm.result }}"
          echo "Web JS   : ${{ needs.web-js.result }}"
          echo "iOS      : ${{ needs.ios.result }}"
          if [[ "${{ needs.android.result }}" == "failure" || \
                "${{ needs.desktop.result }}" == "failure" || \
                "${{ needs.web-wasm.result }}" == "failure" || \
                "${{ needs.web-js.result }}" == "failure" || \
                "${{ needs.ios.result }}" == "failure" ]]; then
            echo "One or more builds failed"
            exit 1
          fi
          echo "All platform builds completed"
